device:
  port: AUTO
  theme: NZXT_B
  log: debug
  sensors:
    network:
      eth: "enp4s0"
      wlo: "wlp3s0"
    cpu:
      temperature_sensor: ""  # e.g. "zenpower_tdie", empty for auto-detection
    disk:
      temperature_sensor: ""  # e.g. "nvme_composite", empty for auto-detection
    gpu:
      provider: "auto"  # auto | amd | nvidia | none
  display:
    width: 800
    height: 480
    reverse: false
    brightness: 20

