<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Monitor body -->
  <rect x="20" y="28" width="216" height="158" rx="14" ry="14" fill="#1a1a2e"/>
  <!-- Screen bezel -->
  <rect x="32" y="40" width="192" height="134" rx="6" ry="6" fill="#0f0f1a"/>
  <!-- Screen glow -->
  <rect x="36" y="44" width="184" height="126" rx="4" ry="4" fill="#0d1b33"/>

  <!-- Bar chart - left group (CPU) -->
  <rect x="52" y="120" width="18" height="36" rx="3" fill="#00c8ff" opacity="0.9"/>
  <rect x="74" y="100" width="18" height="56" rx="3" fill="#00c8ff" opacity="0.9"/>
  <rect x="96" y="88"  width="18" height="68" rx="3" fill="#00c8ff" opacity="0.9"/>

  <!-- Bar chart - right group (GPU) -->
  <rect x="128" y="110" width="18" height="46" rx="3" fill="#7b2fff" opacity="0.9"/>
  <rect x="150" y="78"  width="18" height="78" rx="3" fill="#7b2fff" opacity="0.9"/>
  <rect x="172" y="94"  width="18" height="62" rx="3" fill="#7b2fff" opacity="0.9"/>

  <!-- Baseline -->
  <rect x="44" y="158" width="156" height="3" rx="1" fill="#2a3a5a"/>

  <!-- Label dots -->
  <circle cx="61"  cy="72" r="4" fill="#00c8ff" opacity="0.7"/>
  <circle cx="75"  cy="72" r="4" fill="#00c8ff" opacity="0.7"/>
  <text x="84" y="76" font-family="sans-serif" font-size="11" fill="#8899bb">CPU</text>

  <circle cx="136" cy="72" r="4" fill="#7b2fff" opacity="0.7"/>
  <circle cx="150" cy="72" r="4" fill="#7b2fff" opacity="0.7"/>
  <text x="159" y="76" font-family="sans-serif" font-size="11" fill="#8899bb">GPU</text>

  <!-- Stand neck -->
  <rect x="112" y="186" width="32" height="22" rx="4" fill="#222240"/>
  <!-- Stand base -->
  <rect x="76" y="206" width="104" height="14" rx="7" fill="#222240"/>

  <!-- Top glow line -->
  <rect x="36" y="44" width="184" height="3" rx="2" fill="#00c8ff" opacity="0.15"/>
</svg>
